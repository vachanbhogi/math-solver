name: Deploy Pages (before + after)
on:
  push:
    branches: [main, demo-after]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (before)
        uses: actions/checkout@v4
        with:
          ref: main
          path: before

      - name: Checkout demo-after
        uses: actions/checkout@v4
        with:
          ref: demo-after
          path: after

      - name: Assemble site
        run: |
          mkdir -p _site/after
          cp before/index.html before/style.css before/solver.js _site/
          cp before/README.md _site/ 2>/dev/null || true
          cp after/index.html after/style.css after/solver.js _site/after/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
